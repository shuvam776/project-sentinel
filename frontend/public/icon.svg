<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cctv-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#C2834E" />
    </linearGradient>
    <linearGradient id="cctv-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#C2834E" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Base Viewfinder Reticle Frame -->
  <rect x="8" y="8" width="48" height="48" rx="8" fill="url(#cctv-glow)" stroke="url(#cctv-amber)" stroke-width="3" />

  <!-- Four Precision Corner Brackets (Security Camera Sensor Crosshairs) -->
  <path d="M16 12H12V16" stroke="#D97706" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M48 12H52V16" stroke="#D97706" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M12 48V52H16" stroke="#D97706" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M52 48V52H48" stroke="#D97706" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center CCTV Detection Lens / Optical Sensor -->
  <rect x="23" y="23" width="18" height="18" rx="4" fill="#18181B" stroke="#F59E0B" stroke-width="1.5" />
  <circle cx="32" cy="32" r="4.5" fill="#F59E0B" />
  <circle cx="33" cy="31" r="1.5" fill="#FFFFFF" />
</svg>
